<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon City: Cyber-Grid Showdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-container">
    <header id="hud">
      <div class="player-hud p1-hud">
        <div class="hud-title">P1 // CYAN STRIKER</div>
        <div class="health-bar-bg">
          <div id="p1-health" class="health-bar-fill"></div>
        </div>
        <div class="hud-stats">
          SCORE: <span id="p1-score">0</span> | AIM: <span id="p1-aim-mode">KEYS</span>
        </div>
      </div>

      <div class="center-hud">
        <div class="arena-name">SECTOR 7-G</div>
        <div id="timer-display">01:30</div>
        <div class="win-target">FIRST TO 5 KILLS</div>
      </div>

      <div class="player-hud p2-hud">
        <div class="hud-title">P2 // MAGENTA PHANTOM</div>
        <div class="health-bar-bg">
          <div id="p2-health" class="health-bar-fill"></div>
        </div>
        <div class="hud-stats">
          SCORE: <span id="p2-score">0</span> | AIM: KEYS
        </div>
      </div>
    </header>

    <main id="canvas-wrapper">
      <canvas id="game-canvas" width="1100" height="620"></canvas>
    </main>

    <footer id="controls-bar">
      <span><strong>P1:</strong> WASD + Space (Press <strong>M</strong> for Mouse Aim)</span>
      <span><strong>P2:</strong> Arrow Keys + Enter</span>
      <span><strong>Pause:</strong> P / Esc</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
